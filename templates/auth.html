<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>{% block title %}{% endblock %} · REC AMS</title>
<link rel="icon" href="{{ url_for('static', filename='rec-icon.png') }}">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="auth">
  <div class="card">
    <img class="logo-full" width="220" height="71" src="{{ url_for('static', filename='rec-logo.png') }}" alt="Rajalakshmi Engineering College">
    {% for cat, msg in get_flashed_messages(with_categories=true) %}<div class="flash {{ cat }}">{{ msg }}</div>{% endfor %}
    {% block body %}{% endblock %}
  </div>
</div>
</body>
</html>
